<style>
:root{--bg:#f4f5fb;--card:#fff;--tx:#161a2e;--mut:#6b7190;--bd:#e3e5f0;--ac:#4f46e5;--ac2:#7c3aed;--ok:#16a34a;--err:#dc2626;--sh:0 6px 24px rgba(40,40,100,.09);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d0f1c;--card:#171a2d;--tx:#eceefa;--mut:#9aa0c3;--bd:#262a45;--sh:0 6px 24px rgba(0,0,0,.4);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0d0f1c;--card:#171a2d;--tx:#eceefa;--mut:#9aa0c3;--bd:#262a45;--sh:0 6px 24px rgba(0,0,0,.4);color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100vh}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--card);z-index:30}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--card);border-bottom:1px solid var(--bd);display:flex;align-items:center;gap:12px;padding:10px 14px}
.logo{width:40px;height:40px;border-radius:12px;background:linear-gradient(135deg,var(--ac),var(--ac2));display:grid;place-items:center;color:#fff;font-weight:800;letter-spacing:.5px;font-size:14px;flex:none}
.ttl{flex:1;min-width:0}.ttl b{display:block;font-size:17px}.ttl small{color:var(--mut);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.burger{width:44px;height:44px;border-radius:12px;display:grid;place-content:center;gap:5px}
.burger i{display:block;width:22px;height:3px;border-radius:2px;background:var(--tx)}
main{max-width:860px;margin:0 auto;padding:14px 14px 110px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}
.stat{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:12px;box-shadow:var(--sh)}
.stat b{font-size:24px;display:block;color:var(--ac)}.stat span{font-size:12px;color:var(--mut)}
.search{width:100%;padding:13px 16px;border-radius:14px;border:1px solid var(--bd);background:var(--card);color:var(--tx);font:inherit;margin-bottom:14px}
.grid{display:grid;gap:12px}@media(min-width:700px){.grid{grid-template-columns:1fr 1fr}}
.item{background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:14px;box-shadow:var(--sh)}
.top{display:flex;gap:12px;align-items:center}
.kab{min-width:52px;height:52px;border-radius:14px;background:linear-gradient(135deg,var(--ac),var(--ac2));color:#fff;display:grid;place-items:center;font-weight:800;font-size:18px;padding:0 6px}
.kab small{display:block;font-size:9px;font-weight:600;opacity:.8;text-align:center}
.nm{flex:1;min-width:0}.nm b{display:block;overflow-wrap:anywhere}.nm span{color:var(--mut);font-size:13px}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}
.tag{font-size:12px;background:color-mix(in srgb,var(--ac) 10%,transparent);color:var(--ac);padding:4px 9px;border-radius:99px}
.acts{display:flex;gap:8px}
.btn{padding:11px 16px;border-radius:12px;font-weight:600;border:1px solid var(--bd);background:var(--card)}
.btn.p{background:linear-gradient(135deg,var(--ac),var(--ac2));color:#fff;border:0}
.btn.d{color:var(--err)}.btn.d.sure{background:var(--err);color:#fff}
.acts .btn{flex:1;padding:9px}
.empty{text-align:center;color:var(--mut);padding:50px 20px}.empty big{font-size:46px;display:block}
.nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--bd);display:flex;justify-content:space-around;padding:8px 10px calc(8px + env(safe-area-inset-bottom,0px));z-index:20}
.nav button{flex:1;display:grid;justify-items:center;font-size:11px;color:var(--mut);gap:2px;padding:4px}
.nav button svg{width:24px;height:24px}
.fab{transform:translateY(-22px);background:linear-gradient(135deg,var(--ac),var(--ac2))!important;color:#fff!important;width:62px;height:62px;flex:none!important;border-radius:50%;box-shadow:0 8px 22px color-mix(in srgb,var(--ac) 50%,transparent);align-content:center}
.ov{position:fixed;inset:0;background:rgba(10,10,30,.55);z-index:40;display:none}.ov.on{display:block}
.sheet{position:fixed;left:0;right:0;bottom:0;max-height:94vh;background:var(--card);border-radius:24px 24px 0 0;z-index:41;display:none;flex-direction:column}
.sheet.on{display:flex;animation:up .25s ease}@keyframes up{from{transform:translateY(40px);opacity:0}}
@media(min-width:700px){.sheet{left:50%;right:auto;width:640px;transform:translateX(-50%);bottom:4vh;border-radius:24px}}
.sh{display:flex;justify-content:space-between;align-items:center;padding:16px 18px;border-bottom:1px solid var(--bd)}.sh b{font-size:18px}
.x{width:38px;height:38px;border-radius:50%;background:var(--bg);font-size:20px}
form{overflow:auto;padding:14px 18px;display:grid;gap:14px;flex:1}
label{font-size:13px;font-weight:600;color:var(--mut);display:block;margin-bottom:5px}
.in{width:100%;padding:13px 14px;border-radius:12px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);font:inherit}
.in:focus{outline:2px solid var(--ac);border-color:transparent}
.chips{display:none;flex-wrap:wrap;gap:6px;margin-top:7px}.f.foc .chips.has{display:flex}
.chip{padding:6px 11px;border-radius:99px;background:color-mix(in srgb,var(--ac) 12%,transparent);color:var(--ac);font-size:13px;border:1px solid color-mix(in srgb,var(--ac) 30%,transparent)}
.chips small{width:100%;color:var(--mut);font-size:11px}
.seg{display:flex;gap:6px}.seg button{flex:1;padding:11px;border-radius:12px;border:1px solid var(--bd);background:var(--bg)}.seg button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.pw{position:relative}.pw button{position:absolute;right:6px;top:6px;width:36px;height:36px;font-size:18px}
.sf{padding:12px 18px calc(12px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--bd);display:flex;gap:10px}.sf .btn{flex:1}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(330px,88vw);background:var(--card);z-index:41;transform:translateX(105%);transition:transform .25s;padding:calc(18px + env(safe-area-inset-top,0px)) 18px 18px;display:flex;flex-direction:column;gap:10px;overflow:auto}
.drawer.on{transform:none}.drawer h4{margin:12px 0 2px;color:var(--mut);font-size:12px;text-transform:uppercase;letter-spacing:.6px}
.drawer .btn{text-align:left;display:flex;gap:10px}
.dots{display:flex;gap:10px;flex-wrap:wrap}.dot{width:36px;height:36px;border-radius:50%;border:3px solid transparent}.dot.on{border-color:var(--tx)}
.co{margin-top:auto;font-size:12px;color:var(--mut);border-top:1px solid var(--bd);padding-top:12px}
.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:11px 18px;border-radius:12px;z-index:60;opacity:0;pointer-events:none;transition:.25s;max-width:90vw;text-align:center}.toast.on{opacity:1}
.bar{display:flex;gap:8px;margin-bottom:14px}.bar .search{margin:0;flex:1;min-width:0}.bar .btn{flex:none}main.wide{max-width:1500px}
.tbw{overflow-x:auto;grid-column:1/-1;background:var(--card);border:1px solid var(--bd);border-radius:14px}
.tb{border-collapse:collapse;font-size:13px;min-width:1250px;width:100%}.tb th,.tb td{border:1px solid var(--bd);padding:7px 8px;text-align:center}.tb th{background:var(--bg);font-weight:700}.tb .ti{font-size:16px}.tb .bd2{background:#bdd7ee;color:#10243a;font-weight:700}.tb tr[data-e]{cursor:pointer}.tb tr[data-e]:hover{background:color-mix(in srgb,var(--ac) 8%,transparent)}.tb td:nth-child(4){text-align:left;min-width:220px}
.lg{position:fixed;inset:0;background:var(--bg);z-index:100;display:grid;place-items:center;padding:20px}
.lgc{background:var(--card);border:1px solid var(--bd);border-radius:22px;padding:26px;width:min(380px,100%);box-shadow:var(--sh);display:grid;gap:14px;text-align:center}
.lgc .logo{margin:0 auto;width:56px;height:56px;font-size:18px}form.lf{overflow:visible;padding:0;flex:none}.err{color:var(--err);font-size:13px;min-height:18px}
.hd{display:none}
@media(min-width:700px){.sheet{width:760px}#fm{grid-template-columns:1fr 1fr}.f[data-k=grp],.f[data-k=fio]{grid-column:1/-1}}
@media(min-width:900px){.hd{display:block}.nav{display:none}main{padding-bottom:30px;max-width:1200px}header{padding:12px 28px}.ttl b{font-size:19px}}
@media(min-width:1100px){.grid{grid-template-columns:repeat(3,1fr)}}

<body>
<header>
  <div class="logo">ESA</div>
  <div class="ttl"><b>ESA · Регистрация</b><small>Эркебаев Самат Адылович</small></div>
  <button class="btn p hd" id="hn">＋ Регистрировать</button><button class="btn hd" id="hx">📥 Excel</button>
  <button class="burger" id="bg" aria-label="Меню"><i></i><i></i><i></i></button>
</header>
<main>
  <div class="stats"><div class="stat"><b id="s1">0</b><span>Записей</span></div><div class="stat"><b id="s2">0</b><span>Кабинетов</span></div><div class="stat"><b id="s3">0</b><span>Отделов</span></div></div>
  <div class="bar"><input class="search" id="q" placeholder="Поиск: кабинет, ФИО, отдел, принтер..."><button class="btn" id="vw">▦ Таблица</button></div>
  <div class="grid" id="list"></div>
</main>
<nav class="nav">
  <button id="nl"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg>Список</button>
  <button class="fab" id="na" aria-label="Регистрировать"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" width="28" height="28"><path d="M12 5v14M5 12h14"/></svg></button>
  <button id="nx"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12m0 0l-4-4m4 4l4-4M4 17v3h16v-3"/></svg>Excel</button>
</nav>
<div class="ov" id="ov"></div>
<div class="sheet" id="sheet">
  <div class="sh"><b id="ft">Регистрация</b><button class="x" id="fx">✕</button></div>
  <form id="fm" autocomplete="off"></form>
  <div class="sf"><button class="btn" id="fc" type="button">Отмена</button><button class="btn p" id="fs" type="button">Сохранить</button></div>
</div>
<aside class="drawer" id="dr">
  <div style="display:flex;align-items:center;gap:10px"><div class="logo">ESA</div><b>Меню</b></div>
  <button class="btn" data-go="l">📋 Список</button>
  <button class="btn" data-go="a">➕ Регистрировать</button>
  <button class="btn" data-go="x">📥 Скачать Excel</button>
  <button class="btn" id="lo">🚪 Выйти</button>
  <button class="btn" id="inst">📲 Установить как приложение</button>
  <h4>Тема</h4>
  <div class="seg" id="th"><button data-t="auto">Авто</button><button data-t="light">Светлая</button><button data-t="dark">Тёмная</button></div>
  <h4>Цвет</h4>
  <div class="dots" id="ac"></div>
  <div class="co"><b>Компания ESA</b><br>Владелец: Эркебаев Самат Адылович<br>Инвентаризация IT · ППКР Ош</div>
</aside>
<div class="lg" id="lg"><form class="lgc lf" id="lf"><div class="logo">ESA</div><b style="font-size:20px">ESA · Регистрация техники</b><small style="color:var(--mut)">Эркебаев Самат Адылович</small>
<input class="in" id="le" type="text" placeholder="Логин" autocomplete="username" autocapitalize="off" required><input class="in" id="lp" type="password" placeholder="Пароль" autocomplete="current-password" required>
<div class="err" id="lr"></div><button class="btn p" type="submit">Войти</button></form></div>
<div class="toast" id="tt"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
// Подключение к Supabase (проект esa-registration).
// anon key публичный: доступ защищён правилами RLS и входом по паролю.
window.ESA_CONFIG = {
  url: "https://aqhcpjixtiqgrnfrgnvl.supabase.co",
  key: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFxaGNwaml4dGlxZ3JuZnJnbnZsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTQzNTkxNzQsImV4cCI6MjEwOTkzNTE3NH0.dm-2VchGEsDqG-j8kaphxnbibcz3JpmKAqqEu2-0xic"
};

<script>
const F=[
 {k:"grp",l:"Раздел (синяя строка в Excel)"},
 {k:"kab",l:"№ Кабинет",ph:"например 59",im:"numeric"},
 {k:"otdel",l:"Отдел"},{k:"fio",l:"ФИО",nos:1},
 {k:"cpu",l:"Процессор"},{k:"ram",l:"RAM"},{k:"hdd",l:"HDD / SSD"},
 {k:"kb",l:"Клава + мышь"},{k:"mon",l:"Монитор"},{k:"prn",l:"Принтер"},
 {k:"usr",l:"USER name"},
 {k:"spk",l:"Колонки",yn:1},{k:"cam",l:"WEB камера",yn:1},{k:"hub",l:"HUB"},{k:"wifi",l:"WIFI",yn:1},
 {k:"sig",l:"Подпись",nos:1},{k:"pw",l:"Пароли",pw:1}
];
const KEY="esa_reg_v1",TK="esa_theme_v1";
const PRE=["ЖЕТЕКЧИЛИК"];
const ACS=[["#4f46e5","#7c3aed"],["#0891b2","#2563eb"],["#059669","#0d9488"],["#e11d48","#f97316"],["#c026d3","#7c3aed"]];
let mem={},rows=[],cur=null,dp=null,view="c";
const $=s=>document.querySelector(s);
const ld=k=>{try{return JSON.parse(localStorage.getItem(k))}catch(e){return mem[k]||null}};
const sv=(k,v)=>{mem[k]=v;try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
const CF=window.ESA_CONFIG||{};
const sb=supabase.createClient(CF.url||"http://x",CF.key||"x");
async function load(){
  const {data,error}=await sb.from("inventory").select("*").order("created_at",{ascending:true});
  if(error){toast("Ошибка: "+error.message);return}
  rows=data;render();
}
let rt=0;
function gate(ok){
  $("#lg").style.display=ok?"none":"grid";
  if(ok){load();if(!rt){rt=1;sb.channel("inv").on("postgres_changes",{event:"*",schema:"public",table:"inventory"},()=>load()).subscribe()}}
}
async function init(){
  if(!CF.url||CF.url.includes("YOUR")){$("#lr").textContent="Заполните config.js (адрес и ключ Supabase)";return}
  const {data}=await sb.auth.getSession();gate(!!data.session);
  sb.auth.onAuthStateChange((_,x)=>gate(!!x));
}
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function toast(m){const t=$("#tt");t.textContent=m;t.classList.add("on");clearTimeout(t._);t._=setTimeout(()=>t.classList.remove("on"),2400)}

function render(){
  $("#vw").textContent=view==="t"?"▤ Карточки":"▦ Таблица";document.querySelector("main").classList.toggle("wide",view==="t");
  const q=$("#q").value.trim().toLowerCase();
  const r=rows.filter(x=>!q||F.some(f=>!f.pw&&String(x[f.k]||"").toLowerCase().includes(q)));
  $("#s1").textContent=rows.length;
  $("#s2").textContent=new Set(rows.map(x=>x.kab).filter(Boolean)).size;
  $("#s3").textContent=new Set(rows.map(x=>(x.otdel||"").trim().toLowerCase()).filter(Boolean)).size;
  $("#list").innerHTML=r.length&&view==="t"?tbl(r):r.length?r.slice().reverse().map(x=>{
    const tg=["cpu","ram","hdd","mon","prn","usr"].filter(k=>x[k]).map(k=>`<span class="tag">${esc(x[k])}</span>`).join("");
    return `<div class="item"><div class="top"><div class="kab"><div>${esc(x.kab||"—")}<small>каб.</small></div></div><div class="nm"><b>${esc(x.fio||"Без ФИО")}</b><span>${esc(x.otdel||"")}</span></div></div><div class="tags">${tg}</div><div class="acts"><button class="btn" data-e="${x.id}">✏️ Изменить</button><button class="btn d" data-d="${x.id}">🗑 Удалить</button></div></div>`}).join("")
   :`<div class="empty" style="grid-column:1/-1"><big>🗂️</big>${rows.length?"Ничего не найдено":"Пока нет записей.<br>Нажмите «+» чтобы зарегистрировать."}</div>`;
}
function tbl(r){
  const C=F.filter(f=>f.k!=="grp"),n=C.length+1,g={};let i=0;
  r.forEach(x=>{const o=x.grp||"Без раздела";(g[o]=g[o]||[]).push(x)});
  return `<div class="tbw"><table class="tb"><tr><th colspan="${n}" class="ti">КРПОЫУӨА компьютерлердин инвентаризациясы</th></tr><tr><th>№</th>${C.map(f=>`<th>${f.l}</th>`).join("")}</tr>`+
   Object.keys(g).sort((a,b)=>(PRE.indexOf(a)+1||99)-(PRE.indexOf(b)+1||99)).map(o=>`<tr><td colspan="${n}" class="bd2">${esc(o)}</td></tr>`+g[o].map(x=>`<tr data-e="${x.id}"><td>${++i}</td>${C.map(f=>`<td>${esc(x[f.k])}</td>`).join("")}</tr>`).join("")).join("")+`</table></div>`;
}
function sugg(k,typed){
  const c={};rows.forEach(r=>{const v=(r[k]||"").trim();if(v&&v!=="-")c[v]=(c[v]||0)+1});
  const t=(typed||"").toLowerCase();
  if(k==="grp")PRE.forEach(p=>{c[p]=(c[p]||0)+1e6});
  return Object.keys(c).filter(v=>v.toLowerCase()!==t&&(!t||v.toLowerCase().includes(t))).sort((a,b)=>c[b]-c[a]).slice(0,8);
}
function build(x){
  x=x||{grp:(rows.length?rows[rows.length-1].grp:"")||PRE[0]};
  $("#fm").innerHTML=F.map(f=>{
    const v=esc(x[f.k]||"");
    let inp;
    if(f.yn)inp=`<div class="seg" data-yn="${f.k}">${["есть","нет"].map(o=>`<button type="button" class="${x[f.k]===o?"on":""}" data-v="${o}">${o}</button>`).join("")}</div>`;
    else if(f.pw)inp=`<div class="pw"><input class="in" name="${f.k}" type="password" value="${v}" autocomplete="new-password" autocapitalize="off"><button type="button" data-eye>👁</button></div>`;
    else inp=`<input class="in" name="${f.k}" value="${v}" inputmode="${f.im||"text"}" placeholder="${f.ph||""}" autocapitalize="${f.k==="usr"||f.k==="grp"?"off":"sentences"}" autocorrect="off" spellcheck="false">`;
    return `<div class="f" data-k="${f.k}"><label>${f.l}</label>${inp}${f.yn||f.pw||f.nos&&0?"":'<div class="chips"></div>'}</div>`}).join("");
  F.forEach(f=>{if(!f.yn&&!f.pw)chips(f.k)});
}
function chips(k){
  const w=$(`.f[data-k="${k}"]`),i=w.querySelector("input"),c=w.querySelector(".chips");
  const s=sugg(k,i.value);
  c.className="chips"+(s.length?" has":"");
  c.innerHTML=s.length?`<small>Вы вводили раньше:</small>`+s.map(v=>`<button type="button" class="chip" data-c="${esc(v)}">${esc(v)}</button>`).join(""):"";
}
function open(id){
  cur=id||null;const x=rows.find(r=>r.id===id);
  $("#ft").textContent=x?"Изменить запись":"Регистрация";
  build(x);show("sheet");
}
function show(w){$("#ov").classList.add("on");$("#"+w).classList.add("on")}
function hide(){["#ov","#sheet","#dr"].forEach(s=>$(s).classList.remove("on"))}
async function save(){
  const o={};
  F.forEach(f=>{
    if(f.yn){const b=$(`[data-yn="${f.k}"] .on`);o[f.k]=b?b.dataset.v:""}
    else o[f.k]=$(`[name="${f.k}"]`).value.trim()});
  const pm=PRE.find(p=>p.toLowerCase()===o.grp.toLowerCase());if(pm)o.grp=pm;
  else{const ex=rows.find(r=>r.grp&&r.grp.toLowerCase()===o.grp.toLowerCase());if(ex)o.grp=ex.grp}
  if(!o.kab&&!o.fio){toast("Укажите № кабинета или ФИО");return}
  const was=cur;
  const {error}=await(was?sb.from("inventory").update(o).eq("id",was):sb.from("inventory").insert(o));
  if(error){toast("Ошибка: "+error.message);return}
  hide();await load();toast(was?"Изменено ✓":"Сохранено ✓");
}
async function xl(){
  if(!rows.length){toast("Нет данных для выгрузки");return}
  const C=F.filter(f=>f.k!=="grp");
  const H=["№",...C.map(f=>f.l)],n=H.length;
  const wb=new ExcelJS.Workbook(),ws=wb.addWorksheet("invent");
  const bd={style:"thin"},B={top:bd,left:bd,bottom:bd,right:bd},cen={vertical:"middle",horizontal:"center",wrapText:true};
  ws.columns=H.map((h,i)=>({width:i==0?5:i==1?10:i==2?12:i==3?34:15}));
  ws.mergeCells(1,1,1,n);const t=ws.getCell(1,1);t.value="КРПОЫУӨА компьютерлердин инвентаризациясы";t.font={bold:true,size:14};t.alignment=cen;ws.getRow(1).height=26;
  const hr=ws.addRow(H);hr.height=36;hr.eachCell(c=>{c.font={bold:true};c.alignment=cen;c.border=B});
  const g={};rows.forEach(r=>{const o=(r.grp||"").trim()||"Без раздела";(g[o]=g[o]||[]).push(r)});
  let i=0;
  Object.keys(g).sort((a,b)=>(PRE.indexOf(a)+1||99)-(PRE.indexOf(b)+1||99)).forEach(o=>{
    const br=ws.addRow([o]);ws.mergeCells(br.number,1,br.number,n);
    const c=br.getCell(1);c.font={bold:true};c.alignment=cen;c.border=B;c.fill={type:"pattern",pattern:"solid",fgColor:{argb:"FFBDD7EE"}};
    g[o].forEach(r=>{const x=ws.addRow([++i,...C.map(f=>r[f.k]||"")]);x.height=32;x.eachCell({includeEmpty:true},(c,j)=>{c.border=B;c.alignment=j==4?{...cen,horizontal:"left"}:cen})});
  });
  const name="ESA_inventory_"+new Date().toISOString().slice(0,10)+".xlsx";
  const data=await wb.xlsx.writeBuffer();
  const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([data],{type:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"}));a.download=name;document.body.appendChild(a);a.click();a.remove();toast("Файл скачан ✓");
}
function theme(t){
  const r=document.documentElement;
  t==="auto"?r.removeAttribute("data-theme"):r.setAttribute("data-theme",t);
  document.querySelectorAll("#th button").forEach(b=>b.classList.toggle("on",b.dataset.t===t));
  const s=ld(TK)||{};s.t=t;sv(TK,s);
}
function accent(i){
  const r=document.documentElement.style;r.setProperty("--ac",ACS[i][0]);r.setProperty("--ac2",ACS[i][1]);
  document.querySelectorAll(".dot").forEach((d,j)=>d.classList.toggle("on",j===i));
  const s=ld(TK)||{};s.a=i;sv(TK,s);
}
// события
$("#q").oninput=render;
$("#vw").onclick=()=>{view=view==="t"?"c":"t";const s=ld(TK)||{};s.v=view;sv(TK,s);render()};
$("#bg").onclick=()=>show("dr");$("#ov").onclick=hide;$("#fx").onclick=hide;$("#fc").onclick=hide;
$("#na").onclick=()=>open();$("#nl").onclick=()=>scrollTo({top:0,behavior:"smooth"});$("#nx").onclick=xl;
$("#fs").onclick=save;
$("#list").onclick=e=>{
  const tr=e.target.closest("tr[data-e]");if(tr){open(tr.dataset.e);return}
  const b=e.target.closest("button");if(!b)return;
  if(b.dataset.e)open(b.dataset.e);
  if(b.dataset.d){
    if(b.classList.contains("sure")){sb.from("inventory").delete().eq("id",b.dataset.d).then(({error})=>{if(error)toast(error.message);else{load();toast("Удалено")}})}
    else{b.classList.add("sure");b.textContent="Точно удалить?";setTimeout(()=>{b.classList.remove("sure");b.textContent="🗑 Удалить"},3000)}
  }
};
const fm=$("#fm");
fm.addEventListener("focusin",e=>{document.querySelectorAll(".f.foc").forEach(f=>f.classList.remove("foc"));const f=e.target.closest(".f");if(f)f.classList.add("foc")});
fm.addEventListener("input",e=>{const f=e.target.closest(".f");if(f&&f.querySelector(".chips"))chips(f.dataset.k)});
fm.addEventListener("pointerdown",e=>{if(e.target.closest(".chip"))e.preventDefault()});
fm.addEventListener("click",e=>{
  const c=e.target.closest(".chip");
  if(c){const f=c.closest(".f"),i=f.querySelector("input");i.value=c.dataset.c;chips(f.dataset.k);const n=f.nextElementSibling&&f.nextElementSibling.querySelector("input");n?n.focus():i.blur();return}
  const y=e.target.closest("[data-yn] button");
  if(y){const was=y.classList.contains("on");y.parentNode.querySelectorAll("button").forEach(b=>b.classList.remove("on"));if(!was)y.classList.add("on");return}
  if(e.target.closest("[data-eye]")){const i=e.target.closest(".pw").querySelector("input");i.type=i.type==="password"?"text":"password"}
});
fm.addEventListener("keydown",e=>{if(e.key==="Enter"){e.preventDefault();const f=e.target.closest(".f"),n=f&&f.nextElementSibling&&f.nextElementSibling.querySelector("input");n?n.focus():save()}});
$("#dr").onclick=e=>{
  const b=e.target.closest("[data-go]");
  if(b){hide();({l:()=>scrollTo({top:0}),a:()=>open(),x:xl})[b.dataset.go]()}
  const t=e.target.closest("[data-t]");if(t)theme(t.dataset.t);
  const d=e.target.closest(".dot");if(d)accent(+d.dataset.i);
};
$("#ac").innerHTML=ACS.map((a,i)=>`<button class="dot" data-i="${i}" style="background:linear-gradient(135deg,${a[0]},${a[1]})"></button>`).join("");
addEventListener("beforeinstallprompt",e=>{e.preventDefault();dp=e});
$("#inst").onclick=async()=>{
  if(dp){dp.prompt();dp=null}
  else toast("Меню браузера → «Добавить на главный экран» / «Установить»");
};
$("#hn").onclick=()=>open();$("#hx").onclick=xl;
$("#lo").onclick=async()=>{hide();await sb.auth.signOut()};
$("#lf").onsubmit=async e=>{e.preventDefault();$("#lr").textContent="";
  const {error}=await sb.auth.signInWithPassword({email:(x=>x.includes("@")?x:x+"@esa.kg")($("#le").value.trim().toLowerCase()),password:$("#lp").value});
  if(error)$("#lr").textContent="Неверный логин или пароль"};
const S=ld(TK)||{};view=S.v||(innerWidth>=900?"t":"c");theme(S.t||"auto");accent(S.a||0);
render();init();
</script>
</body>
</html>
